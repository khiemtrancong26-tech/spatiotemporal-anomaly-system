openapi: 3.0.3
info:
  title: Spatiotemporal PM2.5 Anomaly API
  version: 0.1.0-draft
  description: 'API Contract for SDD v0.3 / SRS v0.4. Review with team before merging as stable. Roles: analyst
    and application admin only; public login/health. Canonical DTO follows shared-core/src/contracts/schemas.ts
    v0.1; some request envelopes and lifecycle are DRAFT until API acceptance. Timestamp UTC Z, GeoJSON [longitude,latitude],
    PM2.5 ug/m3. OPEN-02/03/04/05/06 remain unresolved; see docs/api/README.md.'
servers:
- url: /
  description: Same-origin via Nginx HTTPS; routes already include /api
tags:
- name: System
- name: Auth
- name: Datasets
- name: Import
- name: Query
- name: Analysis
- name: Anomalies
- name: Offline
- name: Admin
- name: Internal
security:
- bearerAuth: []
paths:
  /api/health:
    get:
      tags:
      - System
      summary: Kiểm tra Backend và MongoDB (public/monitoring)
      operationId: get_api_health
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                    - degraded
                  timestamp:
                    type: string
                    format: date-time
                    description: UTC ISO 8601 with Z; payload normalized by server
                additionalProperties: false
                required:
                - status
                - timestamp
        '400':
          description: Malformed query/payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing/invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict/version mismatch/reused mutation ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation or insufficient detector data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/login:
    post:
      tags:
      - Auth
      summary: Đăng nhập, nhận bearer JWT
      operationId: post_api_auth_login
      description: Do not log password/token; credentials transported via HTTPS.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Malformed query/payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing/invalid credentials
          content:
            application/json:
