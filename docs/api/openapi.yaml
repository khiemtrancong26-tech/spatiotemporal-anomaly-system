components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
          additionalProperties: false
          required:
          - code
          - message
      additionalProperties: false
      required:
      - error
    PageInfo:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
        nextCursor:
          type: string
          nullable: true
      additionalProperties: false
      required:
      - limit
      - nextCursor
    UserPublic:
      type: object
      properties:
        id:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        username:
          type: string
        role:
          type: string
          enum:
          - analyst
          - admin
        isActive:
          type: boolean
      additionalProperties: false
      required:
      - id
      - username
      - role
      - isActive
    ImportIssue:
      type: object
      properties:
        rowNumber:
          type: integer
          minimum: 1
        reason:
          type: string
          enum:
          - DUPLICATE_SAME_VALUE
          - DUPLICATE_VALUE_CONFLICT
          - INVALID_ROW
        field:
          type: string
        keptRowNumber:
          type: integer
          minimum: 1
      additionalProperties: false
      required:
      - rowNumber
      - reason
    ImportSummary:
      type: object
      properties:
        totalRows:
          type: integer
          minimum: 0
        importedRows:
          type: integer
          minimum: 0
        duplicateRows:
          type: integer
          minimum: 0
        conflictingRows:
          type: integer
          minimum: 0
        invalidRows:
          type: integer
          minimum: 0
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ImportIssue'
      additionalProperties: false
      required:
      - totalRows
      - importedRows
      - duplicateRows
      - conflictingRows
      - invalidRows
      - issues
    Dataset:
      type: object
      properties:
        id:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        name:
          type: string
        sourceFilename:
          type: string
        status:
          type: string
          enum:
          - uploaded
          - awaiting_mapping
          - importing
          - imported
          - failed
        createdBy:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        createdAt:
          type: string
          format: date-time
          description: UTC ISO 8601 with Z; payload normalized by server
        importSummary:
          $ref: '#/components/schemas/ImportSummary'
      additionalProperties: false
      required:
      - id
      - name
      - sourceFilename
      - status
      - createdBy
      - createdAt
    Sensor:
      type: object
      properties:
        id:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        datasetId:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        externalId:
          type: string
        name:
          type: string
        location:
          type: object
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number
              description: '[longitude, latitude], WGS84'
          additionalProperties: false
          required:
          - type
          - coordinates
        type:
          type: string
          enum:
          - pm25
        unit:
          type: string
          enum:
          - ug/m3
        region:
          type: string
      additionalProperties: false
      required:
      - id
      - datasetId
      - externalId
      - name
      - location
      - type
      - unit
    Reading:
      type: object
      properties:
        id:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        datasetId:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        sensorId:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        ts:
          type: string
          format: date-time
          description: UTC ISO 8601 with Z; payload normalized by server
        location:
          type: object
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number
              description: '[longitude, latitude], WGS84'
          additionalProperties: false
          required:
          - type
          - coordinates
        value:
          type: number
          minimum: 0
          description: Finite number; NaN/Infinity forbidden
        unit:
          type: string
          enum:
          - ug/m3
      additionalProperties: false
      required:
      - id
      - datasetId
      - sensorId
      - ts
      - location
      - value
      - unit
    AnalysisRun:
      description: >-
        queued -> running -> completed hoặc failed; queued có thể failed trước khi chạy. Terminal không tự quay lại running.
        completed chỉ sau khi toàn bộ kết quả đã lưu và đọc được; failed không công bố partial.
        scope là snapshot phạm vi đã tiếp nhận, không lấy từ bộ lọc UI hiện tại.
        completedAt có khi terminal (completed hoặc failed); error bắt buộc khi failed và vắng khi trạng thái khác.
      type: object
      properties:
        id:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        datasetId:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        family:
          type: string
          enum:
          - statistical
          - ml
        method:
          type: string
        config:
          type: object
          additionalProperties: true
        scope:
          $ref: '#/components/schemas/AnalysisScope'
        error:
          $ref: '#/components/schemas/AnalysisFailure'
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
        createdAt:
          type: string
          format: date-time
          description: UTC ISO 8601 with Z; payload normalized by server
        completedAt:
          type: string
          format: date-time
          description: UTC ISO 8601 with Z; payload normalized by server
        engineVersion:
          type: string
        modelVersion:
          type: string
      additionalProperties: false
      required:
      - id
      - datasetId
      - family
      - method
      - config
      - status
      - createdAt
      - scope
      allOf:
      - oneOf:
        - properties:
            status:
              enum: [queued, running]
          not:
            anyOf:
            - required: [completedAt]
            - required: [error]
        - properties:
            status:
              enum: [completed]
          required: [completedAt]
          not:
            required: [error]
        - properties:
            status:
              enum: [failed]
          required: [completedAt, error]
    Anomaly:
      type: object
      properties:
        id:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        datasetId:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        sensorId:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        readingId:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        analysisRunId:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        ts:
          type: string
          format: date-time
          description: UTC ISO 8601 with Z; payload normalized by server
        location:
          type: object
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number
              description: '[longitude, latitude], WGS84'
          additionalProperties: false
          required:
          - type
          - coordinates
        family:
          type: string
          enum:
          - statistical
          - ml
        method:
          type: string
        score:
          type: number
          description: Finite detector-specific score, not air-quality probability
        severity:
          type: string
          enum:
          - low
          - medium
          - high
        status:
          type: string
          enum:
          - open
          - confirmed
          - false_positive
        note:
          type: string
        version:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
          description: UTC ISO 8601 with Z; payload normalized by server
      additionalProperties: false
      required:
      - id
      - datasetId
      - sensorId
      - readingId
      - analysisRunId
      - ts
      - location
      - family
      - method
      - score
      - severity
      - status
      - note
      - version
      - updatedAt
    ReviewChanges:
      type: object
      properties:
        status:
          type: string
          enum:
          - open
          - confirmed
          - false_positive
        note:
          type: string
      additionalProperties: false
      minProperties: 1
    OfflineReviewMutation:
      type: object
      properties:
        clientMutationId:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        anomalyId:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        baseVersion:
          type: integer
          minimum: 1
        changes:
          $ref: '#/components/schemas/ReviewChanges'
        createdAt:
          type: string
          format: date-time
          description: UTC ISO 8601 with Z; payload normalized by server
      additionalProperties: false
      required:
      - clientMutationId
      - anomalyId
      - baseVersion
      - changes
      - createdAt
    SingleDataset:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Dataset'
      additionalProperties: false
      required:
      - data
    SingleAnomaly:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Anomaly'
      additionalProperties: false
      required:
      - data
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
      additionalProperties: false
      required:
      - username
      - password
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      additionalProperties: false
      required:
      - username
      - password
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
          - Bearer
        user:
          $ref: '#/components/schemas/UserPublic'
      additionalProperties: false
      required:
      - accessToken
      - tokenType
      - user
    MappingRequest:
      type: object
      properties:
        fieldMap:
          type: object
          properties:
            sensorId:
              type: string
            latitude:
              type: string
            longitude:
              type: string
            timestamp:
              type: string
            value:
              type: string
            unit:
              type: string
            name:
              type: string
            region:
              type: string
          additionalProperties: false
          required:
          - sensorId
          - latitude
          - longitude
          - timestamp
          - value
        unit:
          type: string
          enum:
          - ug/m3
      additionalProperties: false
      required:
      - fieldMap
      - unit
    ValidationReport:
      type: object
      properties:
        datasetId:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        status:
          type: string
          enum:
          - uploaded
          - awaiting_mapping
          - importing
          - imported
          - failed
        sourceColumns:
          type: array
          items:
            type: string
        totalRows:
          type: integer
          minimum: 0
        validRows:
          type: integer
          minimum: 0
        invalidRows:
          type: integer
          minimum: 0
        mappingSuggestions:
          type: object
          additionalProperties:
            type: string
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ImportIssue'
      additionalProperties: false
      required:
      - datasetId
      - status
      - sourceColumns
      - totalRows
      - validRows
      - invalidRows
      - mappingSuggestions
      - issues
    AnalysisFailure:
      type: object
      description: Lỗi job an toàn để hiển thị; không chứa stack trace/model path/secrets. Danh mục code theo detector contract cần chốt.
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
    AnalysisScope:
      description: Phạm vi tiếp nhận; thiếu scope tương đương object rỗng (toàn dataset). sensorIds rỗng và biên from/to cần chốt trước triển khai, không tự suy ra.
      type: object
      additionalProperties: false
      properties:
        sensorIds:
          type: array
          items:
            type: string
            description: Opaque ID string; do not assume MongoDB _id format
            minLength: 1
        from:
          type: string
          format: date-time
          description: UTC ISO 8601 with Z; payload normalized by server
        to:
          type: string
          format: date-time
          description: UTC ISO 8601 with Z; payload normalized by server
    DetectionRequest:
      type: object
      properties:
        datasetId:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        family:
          type: string
          enum:
          - statistical
          - ml
        method:
          type: string
        config:
          type: object
          additionalProperties: true
        scope:
          $ref: '#/components/schemas/AnalysisScope'
      additionalProperties: false
      required:
      - datasetId
      - family
      - method
      - config
    ReviewPatchRequest:
      type: object
      properties:
        baseVersion:
          type: integer
          minimum: 1
        changes:
          $ref: '#/components/schemas/ReviewChanges'
      additionalProperties: false
      required:
      - baseVersion
      - changes
    SyncPushRequest:
      type: object
      properties:
        mutations:
          type: array
          items:
            $ref: '#/components/schemas/OfflineReviewMutation'
      additionalProperties: false
      required:
      - mutations
    SyncMutationResult:
      type: object
      properties:
        clientMutationId:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        outcome:
          type: string
          enum:
          - applied
          - duplicate
          - conflict
          - rejected
        anomaly:
          $ref: '#/components/schemas/Anomaly'
        error:
          $ref: '#/components/schemas/Error'
      additionalProperties: false
      required:
      - clientMutationId
      - outcome
    SyncPushResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncMutationResult'
      additionalProperties: false
      required:
      - results
    SyncPullResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Anomaly'
        page:
          $ref: '#/components/schemas/PageInfo'
      additionalProperties: false
      required:
      - data
      - page
    ExportPage:
      type: object
      properties:
        data:
          type: object
          properties:
            sensors:
              type: array
              items:
                $ref: '#/components/schemas/Sensor'
            readings:
              type: array
              items:
                $ref: '#/components/schemas/Reading'
            anomalies:
              type: array
              items:
                $ref: '#/components/schemas/Anomaly'
          additionalProperties: false
          required:
          - sensors
          - readings
          - anomalies
        page:
          $ref: '#/components/schemas/PageInfo'
        datasetId:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
      additionalProperties: false
      required:
      - data
      - page
      - datasetId
    AggregatedReading:
      type: object
      properties:
        ts:
          type: string
          format: date-time
          description: UTC ISO 8601 with Z; payload normalized by server
        location:
          type: object
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number
              description: '[longitude, latitude], WGS84'
          additionalProperties: false
          required:
          - type
          - coordinates
        average:
          type: number
        count:
          type: integer
          minimum: 1
      additionalProperties: false
      required:
      - ts
      - location
      - average
      - count
    BulkReadingRequest:
      type: object
      properties:
        datasetId:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        readings:
          type: array
          items:
            $ref: '#/components/schemas/Reading'
      additionalProperties: false
      required:
      - datasetId
      - readings
    IdempotencyReceiptStatus:
      type: string
      enum:
      - processing
      - completed
      - failed
      description: Stored server-side; not a replacement for AnalysisRun.status.
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
        timestamp:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - status
      - timestamp
    BulkReadingResponse:
      type: object
      properties:
        accepted:
          type: integer
          minimum: 0
        duplicates:
          type: integer
          minimum: 0
        conflicts:
          type: integer
          minimum: 0
      additionalProperties: false
      required:
      - accepted
      - duplicates
      - conflicts
    AnalysisCreateResponse:
