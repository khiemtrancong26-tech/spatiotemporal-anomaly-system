components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
          additionalProperties: false
          required:
          - code
          - message
      additionalProperties: false
      required:
      - error
    PageInfo:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
        nextCursor:
          type: string
          nullable: true
      additionalProperties: false
      required:
      - limit
      - nextCursor
    UserPublic:
      type: object
      properties:
        id:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        username:
          type: string
        role:
          type: string
          enum:
          - analyst
          - admin
        isActive:
          type: boolean
      additionalProperties: false
      required:
      - id
      - username
      - role
      - isActive
    ImportIssue:
      type: object
      properties:
        rowNumber:
          type: integer
          minimum: 1
        reason:
          type: string
          enum:
          - DUPLICATE_SAME_VALUE
          - DUPLICATE_VALUE_CONFLICT
          - INVALID_ROW
        field:
          type: string
        keptRowNumber:
          type: integer
          minimum: 1
      additionalProperties: false
      required:
      - rowNumber
      - reason
    ImportSummary:
      type: object
      properties:
        totalRows:
          type: integer
          minimum: 0
        importedRows:
          type: integer
          minimum: 0
        duplicateRows:
          type: integer
          minimum: 0
        conflictingRows:
          type: integer
          minimum: 0
        invalidRows:
          type: integer
          minimum: 0
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ImportIssue'
      additionalProperties: false
      required:
      - totalRows
      - importedRows
      - duplicateRows
      - conflictingRows
      - invalidRows
      - issues
    Dataset:
      type: object
      properties:
        id:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        name:
          type: string
        sourceFilename:
          type: string
        status:
          type: string
          enum:
          - uploaded
          - awaiting_mapping
          - importing
          - imported
          - failed
        createdBy:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        createdAt:
          type: string
          format: date-time
          description: UTC ISO 8601 with Z; payload normalized by server
        importSummary:
          $ref: '#/components/schemas/ImportSummary'
      additionalProperties: false
      required:
      - id
      - name
      - sourceFilename
      - status
      - createdBy
      - createdAt
    Sensor:
      type: object
      properties:
        id:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        datasetId:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        externalId:
          type: string
        name:
          type: string
        location:
          type: object
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number
              description: '[longitude, latitude], WGS84'
          additionalProperties: false
          required:
          - type
          - coordinates
        type:
          type: string
          enum:
          - pm25
        unit:
          type: string
          enum:
          - ug/m3
        region:
          type: string
      additionalProperties: false
      required:
      - id
      - datasetId
      - externalId
      - name
      - location
      - type
      - unit
    Reading:
      type: object
      properties:
        id:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        datasetId:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        sensorId:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        ts:
          type: string
          format: date-time
          description: UTC ISO 8601 with Z; payload normalized by server
        location:
          type: object
          properties:
            type:
              type: string
              enum:
              - Point
            coordinates:
              type: array
              minItems: 2
              maxItems: 2
              items:
                type: number
              description: '[longitude, latitude], WGS84'
          additionalProperties: false
          required:
          - type
          - coordinates
        value:
          type: number
          minimum: 0
          description: Finite number; NaN/Infinity forbidden
        unit:
          type: string
          enum:
          - ug/m3
      additionalProperties: false
      required:
      - id
      - datasetId
      - sensorId
      - ts
      - location
      - value
      - unit
    AnalysisRun:
      type: object
      properties:
        id:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        datasetId:
          type: string
          description: Opaque ID string; do not assume MongoDB _id format
          minLength: 1
        family:
          type: string
          enum:
          - statistical
          - ml
        method:
          type: string
        config:
          type: object
          additionalProperties: true
        status:
          type: string
          enum:
          - running
          - completed
          - failed
        createdAt:
          type: string
