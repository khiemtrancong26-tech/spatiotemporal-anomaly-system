openapi: 3.0.3
info:
  title: Spatiotemporal PM2.5 Anomaly API
  version: 0.3.0-draft
  description: API contract draft based on SRS v0.5; API standardization review (2026-11-12).
    Resource-oriented /api/v1; bounded sort, keyset cursor, POST idempotency, endpoint-specific status codes.
    Analysis async approved 2026-11-13 (D008); execution technology and operating limits remain open. OPEN-02/03/04/05/07 and unrelated NEW items remain unresolved. No endpoint is assumed implemented.
servers:
- url: /
  description: Same-origin Nginx HTTPS :443; paths include /api/v1
tags:
- name: System
- name: Auth
- name: Datasets
- name: Import
- name: Query
- name: Analysis
- name: Anomalies
- name: Offline
- name: Admin
- name: Internal
security:
- bearerAuth: []
paths:
  /api/v1/health:
    get:
      tags:
      - System
      summary: 'Readiness: Backend và MongoDB'
      operationId: get_api_v1_health
      description: 200 khi sẵn sàng; 503 khi dependency bắt buộc không khả dụng. 503 trả cùng HealthResponse
        với status=degraded. Không yêu cầu JWT.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Dependency quan trọng không khả dụng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Allow:
              description: Danh sách HTTP methods được hỗ trợ tại path.
              schema:
                type: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/tokens:
    post:
      tags:
      - Auth
      summary: Đăng nhập, cấp JWT
      operationId: post_api_v1_auth_tokens
      description: Không bắt buộc Idempotency-Key; sai thông tin đăng nhập trả 401, không tiết lộ username
        có tồn tại.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            WWW-Authenticate:
              description: Bearer challenge cho API được bảo vệ.
              schema:
                type: string
              example: Bearer realm="pm25-api"
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              description: Đưa ra khi rate-limit được triển khai.
              schema:
                type: string
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Allow:
              description: Danh sách HTTP methods được hỗ trợ tại path.
              schema:
                type: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/register:
    post:
      tags:
      - Auth
      summary: Tự đăng ký tài khoản analyst
      operationId: post_api_v1_auth_register
      description: >-
        Public; chỉ nhận username/password. Tái sử dụng User, validation, password hashing
        và quy tắc username duy nhất của luồng tạo tài khoản. Server luôn gán role=analyst,
        isActive=true; không nhận role/isActive từ client (422). Username trùng trả 409,
        kể cả request đồng thời với tạo user qua Admin. Thành công không trả token/password/hash;
        FE chuyển về Login, không auto-login. Không yêu cầu Idempotency-Key;
        gửi lại sau khi đã tạo có thể trả 409.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created analyst; FE chuyển về Login
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/UserResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        role:
                          type: string
                          enum: [analyst]
                        isActive:
                          type: boolean
                          enum: [true]
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Username đã tồn tại theo quy tắc username duy nhất hiện có
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation failed; bao gồm trường role/isActive hoặc trường ngoài schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method Not Allowed
          headers:
            Allow:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/users/me:
    get:
      tags:
      - Auth
      summary: Thông tin tài khoản đã xác thực
      operationId: get_api_v1_users_me
      x-roles:
      - analyst
      - admin
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            WWW-Authenticate:
              description: Bearer challenge cho API được bảo vệ.
              schema:
                type: string
              example: Bearer realm="pm25-api"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Allow:
              description: Danh sách HTTP methods được hỗ trợ tại path.
              schema:
                type: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/datasets:
    get:
      tags:
      - Datasets
      summary: Liệt kê Dataset đã imported
      operationId: get_api_v1_datasets
      description: Only imported datasets; `createdAt` là khóa sắp xếp chính và `_id` là khóa phụ. Empty list
        = 200 [].
      x-roles:
      - analyst
      - admin
      parameters:
      - in: query
        name: sort
        required: false
        schema:
          type: string
          enum:
          - createdAt:asc
          - createdAt:desc
          default: createdAt:desc
        description: Whitelist sort. Backend thêm _id làm tie-breaker (createdAt + _id); cursor chứa khóa cuối
          và fingerprint filter/sort.
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
      - in: query
        name: cursor
        required: false
        schema:
          type: string
        description: Opaque; gắn với bộ lọc và sort; đổi filter/sort phải bỏ cursor và bắt đầu trang đầu.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetPage'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            WWW-Authenticate:
              description: Bearer challenge cho API được bảo vệ.
              schema:
                type: string
              example: Bearer realm="pm25-api"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Allow:
              description: Danh sách HTTP methods được hỗ trợ tại path.
              schema:
                type: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - Import
      summary: Upload CSV/JSON và tạo Dataset
      operationId: post_api_v1_datasets
      description: POST uploads source file and initializes Dataset. Retry cùng Idempotency-Key và nội dung
        trả lại cùng dataset/status 201; file content+metadata nằm trong fingerprint request. OPEN-05 file
        size limit TBD.
      x-roles:
      - analyst
      - admin
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
        description: UUID cho một thao tác logic; khi retry phải giữ nguyên key. Không dùng lại key cho thao tác khác.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
              additionalProperties: false
              required:
              - file
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleDataset'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Content Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            WWW-Authenticate:
              description: Bearer challenge cho API được bảo vệ.
              schema:
                type: string
              example: Bearer realm="pm25-api"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Allow:
              description: Danh sách HTTP methods được hỗ trợ tại path.
              schema:
                type: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/datasets/{id}/validation:
    get:
      tags:
      - Import
      summary: Báo cáo validation và mapping gợi ý
      operationId: get_api_v1_datasets_by_id_validation
      x-roles:
      - analyst
      - admin
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          minLength: 1
        description: ID opaque; API không yêu cầu Client giải mã ObjectId.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationReport'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            WWW-Authenticate:
              description: Bearer challenge cho API được bảo vệ.
              schema:
                type: string
              example: Bearer realm="pm25-api"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Allow:
              description: Danh sách HTTP methods được hỗ trợ tại path.
              schema:
                type: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/datasets/{id}/mapping:
    put:
      tags:
      - Import
      summary: Xác nhận mapping và đơn vị
      operationId: put_api_v1_datasets_by_id_mapping
      description: Replace mapping resource. Lặp lại cùng nội dung không tạo thay đổi nghiệp vụ mới; chỉ cho
        phép khi state chấp nhận mapping. OPEN-02 chưa chốt timezone thiếu offset.
      x-roles:
      - analyst
      - admin
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          minLength: 1
        description: ID opaque; API không yêu cầu Client giải mã ObjectId.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MappingRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleDataset'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            WWW-Authenticate:
              description: Bearer challenge cho API được bảo vệ.
              schema:
                type: string
              example: Bearer realm="pm25-api"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Allow:
              description: Danh sách HTTP methods được hỗ trợ tại path.
              schema:
                type: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/datasets/{id}/imports:
    post:
      tags:
      - Import
      summary: Thực hiện import Dataset theo BR-08
      operationId: post_api_v1_datasets_by_id_imports
      description: 'Profile synchronous draft: 200 khi imported hoàn tất, trả Dataset hiện tại. Cùng key retry
        không chạy lại; dataset importing => 409 cho request khác; imported => không import lại. Một file thất
        bại cần cleanup và thao tác retry có chủ đích/key mới. Path /imports thể hiện yêu cầu nhập dữ liệu; chưa có Import
        resource ID độc lập. Import giữ đồng bộ; quyết định Analysis async không áp dụng cho Import.'
      x-roles:
      - analyst
      - admin
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          minLength: 1
        description: ID opaque; API không yêu cầu Client giải mã ObjectId.
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          format: uuid
        description: UUID cho một thao tác logic; khi retry phải giữ nguyên key. Không dùng lại key cho thao tác khác.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleDataset'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            WWW-Authenticate:
              description: Bearer challenge cho API được bảo vệ.
              schema:
                type: string
              example: Bearer realm="pm25-api"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Allow:
              description: Danh sách HTTP methods được hỗ trợ tại path.
              schema:
                type: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/sensors:
    get:
      tags:
      - Query
      summary: Lọc sensors trong dataset
      operationId: get_api_v1_sensors
      x-roles:
      - analyst
      - admin
      parameters:
      - in: query
        name: datasetId
        required: true
        schema:
          type: string
          minLength: 1
      - in: query
        name: bbox
        required: false
        schema:
          type: string
          example: 106.60,10.70,106.80,10.90
        description: minLon,minLat,maxLon,maxLat (WGS84).
      - in: query
        name: sort
        required: false
        schema:
          type: string
          enum:
          - externalId:asc
          - externalId:desc
          default: externalId:asc
        description: Whitelist sort. Backend thêm _id làm tie-breaker (externalId + _id); cursor chứa khóa
          cuối và fingerprint filter/sort.
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
      - in: query
        name: cursor
        required: false
        schema:
          type: string
        description: Opaque; gắn với bộ lọc và sort; đổi filter/sort phải bỏ cursor và bắt đầu trang đầu.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorPage'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            WWW-Authenticate:
              description: Bearer challenge cho API được bảo vệ.
              schema:
                type: string
              example: Bearer realm="pm25-api"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Allow:
              description: Danh sách HTTP methods được hỗ trợ tại path.
              schema:
                type: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/readings:
    get:
      tags:
      - Query
      summary: Lọc readings theo không gian và thời gian
      operationId: get_api_v1_readings
      description: Stable keyset order (ts,_id) asc/desc. Cursor binds dataset/time/sensor/bbox/sort; không
        tải cả dataset một request.
      x-roles:
      - analyst
      - admin
      parameters:
      - in: query
        name: datasetId
        required: true
        schema:
          type: string
          minLength: 1
      - in: query
        name: sensorId
        required: false
        schema:
          type: string
          minLength: 1
      - in: query
        name: bbox
        required: false
        schema:
          type: string
          example: 106.60,10.70,106.80,10.90
        description: minLon,minLat,maxLon,maxLat (WGS84).
      - in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
        description: UTC ISO 8601 with Z; range áp dụng cho readings/anomalies.
      - in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
        description: UTC ISO 8601 with Z; range áp dụng cho readings/anomalies.
      - in: query
        name: sort
        required: false
        schema:
          type: string
          enum:
          - ts:asc
          - ts:desc
          default: ts:asc
        description: Whitelist sort. Backend thêm _id làm tie-breaker (ts + _id); cursor chứa khóa cuối và
          fingerprint filter/sort.
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
      - in: query
        name: cursor
        required: false
        schema:
          type: string
        description: Opaque; gắn với bộ lọc và sort; đổi filter/sort phải bỏ cursor và bắt đầu trang đầu.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingPage'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Unprocessable Content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
