<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="635" viewBox="0 0 1600 635"><rect width="1600" height="635" fill="#F2F5F9"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#6D8498" stroke-width="1.5"/></marker><marker id="route" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#2463D4" stroke-width="1.5"/></marker></defs>
<style>text{font-family:'Segoe UI',Inter,Arial,sans-serif;fill:#17283F}.label{font-size:14px;font-weight:700}.subtitle{font-size:13px;fill:#63788F}.small{font-size:12px;fill:#8393A6}.top{font-size:31px;font-weight:800;letter-spacing:-1px}.step{font-size:12px;font-weight:700;fill:#087E8B;letter-spacing:2px}.route{font-size:14px;font-weight:800;fill:#2463D4}</style>
<text x="60" y="63" class="step">PM2.5 EXPLORER · PRODUCT FLOW</text><text x="60" y="107" class="top">Từ dữ liệu thô đến quyết định của Analyst</text><text x="60" y="138" class="subtitle">M4 Visualization là nơi kiểm tra bối cảnh, không thay thế kết quả của thuật toán hoặc quyết định review.</text><rect x="56" y="202" width="272" height="202" rx="16" fill="white" stroke="#DDE4EC"/><rect x="56" y="202" width="272" height="6" rx="4" fill="#087E8B"/><text x="76" y="245" class="step">01 · DATA EXPLORATION</text><text x="76" y="286" font-size="22" font-weight="750">Hiểu dữ liệu</text><text x="76" y="325" class="subtitle">Profile / Aggregates</text><text x="76" y="353" class="subtitle">Phạm vi và chất lượng</text><path d="M328,307 H348" stroke="#6D8498" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="360" y="202" width="272" height="202" rx="16" fill="white" stroke="#DDE4EC"/><rect x="360" y="202" width="272" height="6" rx="4" fill="#2463D4"/><text x="380" y="245" class="step">02 · ANALYSIS</text><text x="380" y="286" font-size="22" font-weight="750">Chạy detector</text><text x="380" y="325" class="subtitle">POST /analysis-runs</text><text x="380" y="353" class="subtitle">Scope được chốt trên Server</text><path d="M632,307 H652" stroke="#6D8498" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="664" y="202" width="272" height="202" rx="16" fill="white" stroke="#DDE4EC"/><rect x="664" y="202" width="272" height="6" rx="4" fill="#2463D4"/><text x="684" y="245" class="step">03 · ANALYSIS RESULTS</text><text x="684" y="286" font-size="22" font-weight="750">Xem phát hiện</text><text x="684" y="325" class="subtitle">GET /analysis-runs/:id</text><text x="684" y="353" class="subtitle">GET /anomalies?runId=...</text><path d="M936,307 H956" stroke="#6D8498" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="968" y="202" width="272" height="202" rx="16" fill="white" stroke="#DDE4EC"/><rect x="968" y="202" width="272" height="6" rx="4" fill="#087E8B"/><text x="988" y="245" class="step">04 · ANOMALIES</text><text x="988" y="286" font-size="22" font-weight="750">Điều tra điểm</text><text x="988" y="325" class="subtitle">List + Detail</text><text x="988" y="353" class="subtitle">Reading · trạm · timestamp</text><path d="M1240,307 H1260" stroke="#6D8498" stroke-width="2" marker-end="url(#arrow)" fill="none"/><rect x="1272" y="202" width="272" height="202" rx="16" fill="white" stroke="#DDE4EC"/><rect x="1272" y="202" width="272" height="6" rx="4" fill="#137A50"/><text x="1292" y="245" class="step">05 · REVIEW</text><text x="1292" y="286" font-size="22" font-weight="750">Ghi nhận đánh giá</text><text x="1292" y="325" class="subtitle">PATCH /anomalies/:id</text><text x="1292" y="353" class="subtitle">open / confirmed / false_positive</text><rect x="56" y="470" width="1488" height="110" rx="16" fill="#EDF3FF" stroke="#C7DBF5"/><text x="79" y="506" class="route">VISUALIZATION M4 — KHÔNG THIẾT KẾ LẠI</text><text x="79" y="535" class="subtitle">Từ Exploration hoặc Anomaly: mở đúng trạm + vị trí + timestamp + readingId, giữ Mapbox / Cube / timeline / camera hiện có.</text><text x="79" y="560" class="small">Nếu reading nằm ngoài 2.000 điểm đã tải: truy vấn bounded bằng GET /readings theo sensorId + thời gian rồi xác minh exact ID; không giả kết quả.</text><path d="M190 406 V455" fill="none" stroke="#2463D4" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#route)"/><path d="M1110 406 V455" fill="none" stroke="#2463D4" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#route)"/><text x="1537" y="610" text-anchor="end" class="small">UX concept v1 · B5/B6/Exploration API đã có · 16.11.2026</text></svg>